
# ==============================================================================
# CALYX KUBERNETES MANIFEST: AGENTIC AI ORCHESTRATION SERVICE
# ==============================================================================
# Responsibilities:
# - Coordinates four specialized candidate-evaluation agents.
# - Uses Redis for task state, execution traces, and distributed locking.
# - Connects to the Job Service through Kubernetes internal DNS.
# - Exposes readiness and liveness endpoints.
#
# Deployment:
# - Initial replicas: 2
# - CPU request: 200m
# - Memory request: 256Mi
# - CPU limit: 800m
# - Memory limit: 1Gi
# - HPA configuration is maintained separately.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: calyx-agent-service
  namespace: calyx
  labels:
    app: calyx-agent-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: calyx-agent-service

  template:
    metadata:
      labels:
        app: calyx-agent-service

    spec:
      containers:
        - name: agent-service
          image: calyx/agent-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8004
              protocol: TCP

          # --------------------------------------------------------------
          # Environment Variables
          # --------------------------------------------------------------

          env:
            - name: SERVICE_NAME
              value: "calyx-agent-service"

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: calyx-common-config
                  key: ENVIRONMENT

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: calyx-common-config
                  key: LOG_LEVEL

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: calyx-common-config
                  key: PORT_AGENT

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: calyx-secrets
                  key: REDIS_URL

            - name: JOB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: calyx-common-config
                  key: JOB_SERVICE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: calyx-secrets
                  key: JWT_SECRET_KEY

          # --------------------------------------------------------------
          # Container Resources
          # --------------------------------------------------------------

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"

          # --------------------------------------------------------------
          # Readiness Probe
          # --------------------------------------------------------------

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8004
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # --------------------------------------------------------------
          # Liveness Probe
          # --------------------------------------------------------------

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8004
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

---
# ==============================================================================
# INTERNAL SERVICE
# ==============================================================================
# Internal DNS:
# http://calyx-agent-service:8004
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: calyx-agent-service
  namespace: calyx
  labels:
    app: calyx-agent-service

spec:
  type: ClusterIP

  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP

  selector:
    app: calyx-agent-service
